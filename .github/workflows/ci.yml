name: CI

on:
  push:
    branches: ["main", "dev", "remediation/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: tests + lint + security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install (full runtime + test requirements)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Lint (ruff, pyflakes + syntax; see ruff.toml)
        run: ruff check .

      - name: Static security scan (bandit, medium+ severity)
        run: bandit -q -r app run.py scripts -ll

      - name: Dependency audit
        run: pip-audit -r requirements.txt

      - name: Tests (includes Solidity tests on the in-memory eth-tester EVM; no Ganache)
        env:
          SECRET_KEY: ci-only-not-a-secret-0123456789abcdef0123456789abcdef
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest tests -q
