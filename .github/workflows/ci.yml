name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: pytest — FL + App Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use the lean test-only requirements (no web3/IPFS) for speed
          pip install -r requirements-test.txt

      - name: Run unit tests
        run: |
          pytest tests/test_differential_privacy.py \
                 tests/test_federated_simulation.py \
                 tests/test_app_models_routes.py \
                 -v --tb=short

      - name: Summary
        if: always()
        run: echo "CI complete — see test results above."
