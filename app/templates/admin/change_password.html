{% extends "base.html" %}

{% block title %}Change Password — Admin{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; margin-top: 3rem;">
    <div class="card shadow">
        <div class="card-header">
            <h5 class="mb-0"><i class="fas fa-key me-2"></i>Change Admin Password</h5>
        </div>
        <div class="card-body">
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="mb-3">
                    <label for="current_password" class="form-label">
                        Current Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="current_password"
                           name="current_password" required autocomplete="current-password">
                </div>

                <div class="mb-3">
                    <label for="new_password" class="form-label">
                        New Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="new_password"
                           name="new_password" required autocomplete="new-password"
                           minlength="10">
                    <div class="form-text">Minimum 10 characters, maximum 128.</div>
                </div>

                <div class="mb-3">
                    <label for="confirm_password" class="form-label">
                        Confirm New Password <span class="text-danger">*</span>
                    </label>
                    <input type="password" class="form-control" id="confirm_password"
                           name="confirm_password" required autocomplete="new-password">
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-warning">
                        <i class="fas fa-save me-1"></i>Change Password
                    </button>
                    <a href="{{ url_for('admin.dashboard') }}" class="btn btn-outline-secondary">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
