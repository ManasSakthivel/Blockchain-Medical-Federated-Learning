# Local development stack (NOT a production deployment; not exercised in the audit
# environment because Docker was unavailable).
#
#   cp .env.example .env     # then fill SECRET_KEY, FILE_KEK, ANCHOR_HMAC_KEY
#   docker compose up --build
#
# All published ports are bound to 127.0.0.1. Ganache runs with a deterministic
# PUBLIC mnemonic: its accounts are known to everyone, so never send real funds
# to them or reuse them anywhere else.
services:
  ganache:
    image: docker.io/trufflesuite/ganache:v7.9.2
    ports:
      - "127.0.0.1:7545:7545"
    command:
      - "--deterministic"
      - "--accounts=10"
      - "--port=7545"
      - "--chain.chainId=1337"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7545 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  ipfs:
    image: docker.io/ipfs/kubo:v0.29.0
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - ipfs_data:/data/ipfs
    healthcheck:
      test: ["CMD", "ipfs", "id"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/ehr.db
      UPLOAD_DIR: /data/uploads
      # Plain HTTP on localhost: the Secure cookie flag would break login.
      SESSION_COOKIE_SECURE: "false"
      BLOCKCHAIN_RPC_URL: http://ganache:7545
      IPFS_API_URL: http://ipfs:5001
    volumes:
      - web_data:/data
    depends_on:
      ganache:
        condition: service_healthy
      ipfs:
        condition: service_healthy

volumes:
  ipfs_data:
  web_data:
